name: BYBE Studio checks

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Standard-library QA backup tests
        run: python -m unittest discover -s tests -v
      - name: Python compile and CLI help
        run: |
          python -m py_compile scripts/bybe.py studio/server.py
          python scripts/bybe.py --help
